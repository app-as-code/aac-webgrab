services:
  # --- Main Application Service ---
  aac-webgrab:
    image: "lscr.io/linuxserver/webgrabplus:5.5.3-ls289"
    container_name: "aac-webgrab"
    hostname: "webgrab"
    restart: "always"


    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Berlin"
      WEBGRABPLUS_DEBUG: "true"


    volumes:
      - "/export/docker/aac-webgrab/config:/config"
      - "/export/docker/aac-webgrab/data:/data"

    networks:
      - interconnect
      - secured
      - stack_internal

    labels:
      traefik.enable: "true"
      traefik.http.routers.aac-webgrab.rule: "Host(`webgrab.example.com`)"
      traefik.http.routers.aac-webgrab.entrypoints: "websecure"
      traefik.http.routers.aac-webgrab.tls: "true"
      traefik.http.routers.aac-webgrab.tls.certresolver: "ionos"
      traefik.docker.network: "services-secured"
      traefik.http.services.aac-webgrab.loadbalancer.server.port: "80"
      traefik.http.services.aac-webgrab.loadbalancer.server.scheme: "http"
      auto-dns.createWildcard.aac-webgrab: "false"
      auto-dns.customDNS.aac-webgrab: "true"
      auto-dns.customDOMAIN.aac-webgrab: "example.com"
      auto-dns.customHost.aac-webgrab: "webgrab"
      homepage.group: "Medien & Entertainment"
      homepage.name: "Webgrab"
      homepage.href: "https://webgrab.example.com"
      homepage.icon: "download.svg"
      homepage.description: "EPG Downloader"


    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'



networks:
  secured:
    name: "services-secured"
    external: true
  exposed:
    name: "services-exposed"
    external: true
  interconnect:
    name: "docker-default"
    external: true
  stack_internal:
    name: "aac-webgrab_stack_internal"
    driver: "bridge"

